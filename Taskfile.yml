# Taskfile.yml
version: '3'

vars:
  ENV: '{{default "local" .ENV}}'
  MIGRATIONS: ./migrations

dotenv: ['.env.{{.ENV}}']

tasks:

  # ----------- dev lifecycle

  dev:
    desc: "local: infra → migrate → swagger → run"
    cmds:
      - task: infra-up
      - task: migrate-up
      - task: swagger
      - task: run

  # ----------- build

  build:
    desc: Compile server and migrate binaries
    cmds:
      - go build -o bin/migrate ./cmd/migrate.exe
      - go build -o bin/server  ./cmd/server.exe


  #------------ buid-migration

  build-migration:
    desc: Compile migrate binaries
    cmds:
      - go build -o bin/migrate.exe ./cmd/migrate


  # ----------- migrations
  migrate-up:
    desc: Apply all pending migrations
    deps: [build-migration]
    cmds:
      - /bin/migrate.exe -path {{.MIGRATIONS}} -database "postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.DB_HOST}}:{{.DB_PORT}}/{{.DB_NAME}}?sslmode={{.DB_SSL}}" 

  migrate-down:
    desc: Roll back last migration
    deps: [build-migration]
    cmds:
      - bin/migrate -path {{.MIGRATIONS}} -database "postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.DB_HOST}}:{{.DB_PORT}}/{{.DB_NAME}}?sslmode={{.DB_SSL}}" 

  migrate-force:
    desc: "Force migration version (usage: task migrate-force VERSION=3)"
    deps: [build-migration]
    cmds:
      - bin/migrate -path {{.MIGRATIONS}} -database "postgres://{{.DB_USER}}:{{.DB_PASS}}@{{.DB_HOST}}:{{.DB_PORT}}/{{.DB_NAME}}?sslmode={{.DB_SSL}}"
  
  # ----------- swagger

  swagger:
    desc: Generate docs/ from annotations in cmd/server/main.go
    cmds:
      - swag init -g cmd/server/main.go -o docs/

  # ----------- run

  run:
    desc: Start payment-service binary
    deps: [build]
    cmds:
      - bin/server

  # ----------- infra

  infra-up:
    desc: "Start infrastructure containers (Postgres + Kafka) for ENV=local|test|staging"
    cmds:
      - docker-compose --env-file .env.{{.ENV}} up -d postgres kafka

  infra-down:
    desc: Stop infrastructure containers
    cmds:
      - docker-compose --env-file .env.{{.ENV}} down

  # ----------- docker (full)

  docker-up:
    desc: "Full Docker environment: infra + migrate + server (ENV=test|staging)"
    cmds:
      - docker-compose --env-file .env.{{.ENV}} up --build

  docker-down:
    desc: Stop and remove all Docker containers
    cmds:
      - docker-compose --env-file .env.{{.ENV}} down

  # ----------- test TODO

  # test:
  #   desc: "Unit tests"
  #   cmds:
  #     - go test ./... -v -race

  # test-integration:
  #   desc: "Integration + smoke tests (ENV=test)"
  #   cmds:
  #     - task: migrate-up
  #       vars: { ENV: test }
  #     - go test ./... -v -race -tags=integration
  #   vars:
  #     ENV: test

  # ----------- clean

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ coverage.out